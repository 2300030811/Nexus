groups:
  - name: nexus_alerts
    rules:
      - alert: KafkaBrokerDown
        expr: nexus_produce_errors_total > 5
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Kafka producer failing for Nexus"
          description: "Producer has seen > 5 errors in the last minute. Kafka may be down."

      - alert: HighAnomalyRate
        expr: sum(rate(nexus_anomalies_detected_total[5m])) / clamp_min(sum(rate(nexus_events_produced_total[5m])), 1) > 0.2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High anomaly rate detected"
          description: "Over 20% of events are being flagged as anomalies. Potential system attack or model drift."

      - alert: DatabaseConnectionFailure
        expr: nexus_db_reconnects_total > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Database connection issues"
          description: "Service {{ $labels.service }} is failing to connect to Postgres."

      - alert: CopilotInvestigationErrors
        expr: increase(nexus_investigation_errors_total[15m]) > 3
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "Copilot investigation error spike"
          description: "AI copilot has failed more than 3 investigations in the last 15 minutes."

      - alert: HighSparkProcessingLag
        expr: nexus_spark_processing_lag_seconds > 60
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Spark processing lag is high"
          description: "Spark processing is lagging over 60 seconds behind event generation."

      - alert: DataFreshnessViolation
        expr: nexus_data_freshness_seconds > 300
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Stale data processing"
          description: "No new events have been fully processed into revenue metrics for 5 minutes."

      - alert: ModelDriftDetected
        expr: (nexus_model_drift_detected_flag == 1 or sum(rate(nexus_anomalies_detected_total[1h])) / clamp_min(sum(rate(nexus_events_produced_total[1h])), 1) > 0.15)
        for: 15m
        labels:
          severity: warning
          team: mlops
        annotations:
          summary: "Model Drift Detected"
          description: "Data distribution has drifted significantly or anomaly rate has shifted beyond expected baseline. Retraining may be triggered."
