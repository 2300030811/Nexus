name: Nexus Platform CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  quality:
    name: Code Quality & Unit Tests
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-dev.txt
        pip install -r common/requirements.txt
        pip install -r api_service/requirements.txt
        pip install -r ml_models/requirements.txt
        pip install -r ai_copilot/requirements.txt
        pip install -r kafka_producer/requirements.txt

    - name: Lint with Ruff
      run: ruff check .

    - name: Format check with Black
      run: black --check .

    - name: Type check with Mypy
      run: |
        mypy common/ kafka_producer/ ml_models/ ai_copilot/ api_service/ --ignore-missing-imports

    - name: Run unit tests
      run: |
        pytest tests/ -v --ignore=tests/integration --junitxml=results.xml --cov=common --cov=api_service --cov=ml_models

    - name: Security scan with Bandit
      run: |
        bandit -r common/ api_service/ ml_models/ ai_copilot/ kafka_producer/ -f json -o bandit-report.json || true
        bandit -r common/ api_service/ ml_models/ ai_copilot/ kafka_producer/

    - name: Check for secrets
      run: |
        pip install detect-secrets
        detect-secrets scan --baseline .secrets.baseline

    - name: Validate Docker Compose
      run: |
        docker compose -f infrastructure/docker-compose.yml config -q

    - name: Validate configuration files
      run: |
        # Check environment variables
        python -c "
        import os
        required_vars = ['PG_DB', 'PG_USER', 'PG_PASSWORD']
        missing = [var for var in required_vars if not os.getenv(var)]
        if missing:
            print(f'Missing required env vars: {missing}')
            exit(1)
        "

  security:
    name: Security Scanning
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4

    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-results.sarif'

    - name: Upload Trivy scan results
      uses: github/codeql-action/upload-sarif@v2
      with:
        sarif_file: 'trivy-results.sarif'

    - name: Run CodeQL Analysis
      uses: github/codeql-action/analyze@v2
      with:
        languages: python

  smoke-test:
    name: Integration Smoke Test
    runs-on: ubuntu-latest
    needs: [quality, security]
    
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: 'pip'

    - name: Start Services
      run: |
        docker compose -f docker-compose.test.yml up -d
        echo "Waiting for services to be healthy..."
        sleep 20

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-dev.txt
        pip install -r common/requirements.txt
        # Needed for integration tests
        pip install psycopg2-binary kafka-python

    - name: Run Smoke Test
      run: |
        pytest tests/integration/test_data_flow.py -v

    - name: Test authentication endpoints
      run: |
        python scripts/test_auth_endpoints.py

    - name: Test metrics endpoints
      run: |
        python scripts/test_metrics_endpoints.py

    - name: Shutdown Services
      if: always()
      run: |
        docker compose -f docker-compose.test.yml down

  build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: quality
    
    strategy:
      matrix:
        service: [api_service, ml_models, ai_copilot, kafka_producer, dashboard]
    
    steps:
    - uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ${{ matrix.service }}/Dockerfile
        push: false
        load: true
        tags: nexus-${{ matrix.service }}:test
        cache-from: type=gha
        cache-to: type=gha,mode=max
