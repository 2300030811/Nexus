version: '3.8'

# Nexus - Staging Deployment Profile
# Usage: docker-compose -f docker-compose.yml -f docker-compose.staging.yml up -d

services:
  producer:
    environment:
      - ENV=staging

  spark-processor:
    environment:
      - ENV=staging

  anomaly-detector:
    environment:
      - ENV=staging

  ai-copilot:
    environment:
      - ENV=staging

  api:
    environment:
      - ENV=staging
    ports:
      - "8080:8000"

  dashboard:
    environment:
      - ENV=staging
    ports:
      - "8502:8501"

  postgres:
    environment:
      - POSTGRES_PASSWORD_FILE=/run/secrets/db_password
    secrets:
      - db_password

  grafana:
    environment:
      - GF_SECURITY_ADMIN_PASSWORD__FILE=/run/secrets/grafana_admin_password
    secrets:
      - grafana_admin_password

secrets:
  db_password:
    file: ./infrastructure/secrets/staging_db_password.txt
  grafana_admin_password:
    file: ./infrastructure/secrets/staging_grafana_password.txt
